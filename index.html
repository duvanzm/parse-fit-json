<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FIT to JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="mb-3">Subir archivo .FIT</h3>

      <input type="file" id="fileInput" class="form-control mb-3" accept=".fit">

      <button class="btn btn-primary" onclick="uploadFile()">
        Convertir a JSON
      </button>

      <hr>

      <pre id="output" class="bg-dark text-light p-3 rounded" style="max-height:400px; overflow:auto;"></pre>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fitness App</title>
</head>
<body>

  <h2>Subir archivo FIT</h2>

  <label>ID Usuario:</label>
  <input type="number" id="userId" value="1" />

  <br><br>

  <input type="file" id="fileInput" accept=".fit">
  <button onclick="uploadFile()">Enviar</button>
  <button onclick="loadWorkouts()">Ver Historial</button>

  <h3>Respuesta</h3>
  <pre id="output"></pre>

  <h3>Historial</h3>
  <pre id="history"></pre>

  <script src="js/app.js"></script>
</body>
</html>
